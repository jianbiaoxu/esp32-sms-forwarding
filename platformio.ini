; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:makergo_esp32c3_supermini]
platform = espressif32
framework = arduino
board = makergo_esp32c3_supermini
board_build.filesystem = littlefs
board_build.variant = super_mini_esp32c3
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
extra_scripts =
    pre:script/inject_app_version.py
    post:script/generate_compilation_database.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0

[env:esp32_c3_ch343]
platform = espressif32
framework = arduino
; 通用 ESP32-C3 4MB 板，USB 由 CH343 转接，避免复用 SuperMini 专用 board 定义
board = esp32-c3-devkitm-1
; 该 CH343 版 ESP32-C3 核心板的 4MB Flash 使用 DIO 更稳妥，避免 QIO 启动异常
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.variant = esp32c3_ch343
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D SMS_BOARD_CH343=1
    -D SMS_DISABLE_OTA_CHECK=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
extra_scripts =
    pre:script/inject_app_version.py
    post:script/generate_compilation_database.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0

