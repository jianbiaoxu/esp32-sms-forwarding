    bblanchon/ArduinoJson@^7.4.0

[env:esp32_c3_ch343_dual]
extends = env:esp32_c3_ch343
; 双路默认版：不写死 WiFi，首次启动自动启用 SIM1 与 SIM2
build_flags =
    ${env:esp32_c3_ch343.build_flags}
    -D SMS_DEFAULT_DUAL=1
